experiment:
  conditions:
    - decision_dfa
    - decision_dfa_hmm
  estimand: "effect of adding the matched decision-format Ctrl-G HMM to the persistent-decision-memory DFA agent"
  show_admissible_actions: false
  seed: 42
  max_steps: 50
  max_head_tokens: 512
  max_action_tokens: 24
  min_action_tokens: 1
  beam_size: 8
  temperature: 1.0
  rollout_temperature: 0.7
  max_hmm_prefix_tokens: null

distillation:
  prompt_format: "decision block with persistent decision-history replay"
  samples_per_state: 4
  split_policy: "state-group train/dev split"
  sequence: "generated post-think text through <action>, action body, </action>, EOS"
  excludes:
    - system and user prompt tokens
    - native thinking tokens
    - environment observations after the action
    - oracle action strings

invariants:
  use_state_tracker: false
  decision_history_replay: true
  dfa_source: "TextWorld info['admissible_commands']"
  dfa_scope: "action body"
  same_prompt_and_dfa_across_conditions: true
  evaluation_backend: "in-process Hugging Face"
