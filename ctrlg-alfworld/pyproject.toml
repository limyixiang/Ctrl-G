[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlg-alfworld"
version = "0.1.0"
description = "Ctrl-G constrained tool generation on the AlfWorld benchmark"
requires-python = ">=3.10"
dependencies = [
    "alfworld",
    "interegular==0.3.3",
    "numpy",
    "pyyaml",
    "torch",
    "transformers",
]

[project.optional-dependencies]
vllm = ["openai>=1.0", "vllm>=0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
