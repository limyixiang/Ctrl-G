[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlg-alfworld"
version = "0.1.0"
description = "Ctrl-G constrained tool generation on the AlfWorld benchmark"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
vllm = ["openai>=1.0"]   # VLLMBackend client

[tool.setuptools.packages.find]
where = ["src"]
